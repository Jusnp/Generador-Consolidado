; Mismos límites que el PHP de Laragon (cargas RIPS/JSON y Excel grandes).
memory_limit = 1024M
upload_max_filesize = 2G
post_max_size = 2G
max_file_uploads = 20
max_execution_time = 0
max_input_time = -1
date.timezone = UTC

; Desarrollo: el código montado se revalida en cada petición.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
